name: Fork sync

# Keeps the townco/tsrs fork aligned with oxc-project/tsrs. See docs/FORK.md.
# Scheduled workflows run only from the default branch, so this file has to live on main.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fork-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Fast-forward main and replay include-reasons
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          save-cache: true
          cache-key: fork-sync

      - name: Sync fork
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/fork-sync.mjs
