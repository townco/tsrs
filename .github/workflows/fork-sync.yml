name: Fork sync

# Replays fork/patches.txt onto oxc-project/tsrs main and moves town/patched.
# Scheduled workflows run only from the default branch, so this file has to live on main.
# The job never pushes main. See docs/FORK.md.

on:
  schedule:
    # 03:00 America/Los_Angeles, including daylight-saving changes.
    - cron: "0 3 * * *"
      timezone: America/Los_Angeles
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fork-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'townco/tsrs'
    name: Replay the patch stack onto upstream main
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          save-cache: false
          cache-key: fork-sync

      # Reads .node-version from this checkout, which is the control branch.
      # tools/fork-sync.mjs installs the candidate worktree's version when it differs.
      - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1

      - name: Cherry-pick, test, and push town/patched
        env:
          GH_TOKEN: ${{ github.token }}
          FORK_PUSH_TOKEN: ${{ secrets.FORK_PUSH_TOKEN }}
        run: node tools/fork-sync.mjs
